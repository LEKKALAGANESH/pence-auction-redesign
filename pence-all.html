<style>
  :root{--bg:#15161a;--panel:#1d1e23;--line:#2c2d33;--text:#eceef1;--sub:#9497a1;--accent:#f2b84b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  header .title{font-weight:700;font-size:14px;margin-right:14px;color:var(--sub);white-space:nowrap;}
  .tab{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .tab:hover{border-color:var(--accent);}
  .tab.active{background:var(--accent);color:#171512;border-color:var(--accent);}
  .tab .n{opacity:.6;margin-right:6px;}
  .tab.active .n{opacity:.7;}
  iframe{flex:1;width:100%;border:0;background:#fff;}
</style>

<title>Pence Heritage</title>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap');

:root{
  --navy:#0d1b3d;
  --navy-2:#152a5c;
  --gold:#b8974f;
  --gold-light:#e4cd9a;
  --cream:#f7f3ea;
  --ink:#1c2333;
  --line:#d8cba8;
  font-family:'Jost',Georgia,serif;
}
body{margin:0;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.serif{font-family:'Playfair Display',Georgia,serif;}
.script{font-family:'Cormorant Garamond',Georgia,serif;}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--navy);border-bottom:1px solid rgba(184,151,79,.35);}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;}
.brand{display:flex;align-items:center;gap:14px;}
.brand .platt{background:#fff;padding:6px 10px;border-radius:3px;display:flex;align-items:center;}
.brand .platt img{display:block;height:30px;width:auto;}
.brand .est{display:block;color:#8fa0c9;font-size:10px;letter-spacing:.2em;margin-top:2px;}
.brand .sub{color:#cfd7ef;letter-spacing:.1em;font-size:12px;}
nav{display:flex;gap:34px;}
nav a{color:#cfd7ef;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transition:color .2s;position:relative;}
nav a:hover{color:var(--gold-light);}
.cta{border:1px solid var(--gold);color:var(--gold-light)!important;padding:9px 20px;border-radius:1px;font-size:12px;}
.cta:hover{background:var(--gold);color:var(--navy)!important;}
@media(max-width:820px){nav{display:none;}}

/* hero */
.hero{position:relative;padding:96px 24px 110px;text-align:center;background:
  radial-gradient(ellipse at 30% -10%, rgba(184,151,79,.16), transparent 60%),
  linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 60%, #1a2f66 100%);
  overflow:hidden;
}
.hero::before{content:"";position:absolute;inset:0;opacity:.05;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 26px);
}
.hero .eyebrow{color:var(--gold-light);letter-spacing:.32em;font-size:11px;text-transform:uppercase;margin-bottom:22px;position:relative;}
.hero h1{color:#fff;font-size:clamp(38px,6vw,66px);line-height:1.08;margin:0 0 22px;font-weight:600;position:relative;}
.hero h1 em{font-style:italic;color:var(--gold-light);font-weight:500;}
.hero p{max-width:600px;margin:0 auto 40px;color:#b9c3e0;font-size:17px;line-height:1.7;position:relative;font-family:'Cormorant Garamond',serif;font-size:20px;}
.hero .btns{display:flex;gap:16px;justify-content:center;position:relative;flex-wrap:wrap;}
.btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:var(--navy);padding:15px 34px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-radius:1px;font-weight:500;}
.btn-outline{border:1px solid rgba(255,255,255,.4);color:#fff;padding:15px 34px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;}
.hero .rule{width:64px;height:1px;background:var(--gold);margin:36px auto 0;position:relative;}

/* stats */
.stats{max-width:980px;margin:-46px auto 0;position:relative;background:#fff;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(13,27,61,.25);display:grid;grid-template-columns:repeat(4,1fr);}
.stats div{padding:30px 16px;text-align:center;border-right:1px solid var(--line);}
.stats div:last-child{border-right:none;}
.stats b{display:block;font-family:'Playfair Display',serif;font-size:26px;color:var(--navy);}
.stats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a7f63;}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr);}.stats div{border-bottom:1px solid var(--line);}}

/* section shell */
section{padding:100px 24px;}
.wrap{max-width:1180px;margin:0 auto;}
.head{text-align:center;max-width:640px;margin:0 auto 56px;}
.head .kicker{color:var(--gold);letter-spacing:.28em;font-size:11px;text-transform:uppercase;margin-bottom:14px;}
.head h2{font-size:clamp(28px,4vw,40px);margin:0 0 14px;color:var(--navy);}
.head p{color:#6b6252;font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.6;}

/* auctions */
.auctions{background:var(--navy);}
.auctions .head h2,.auctions .head p{color:#fff;}
.auctions .head p{color:#aab4d6;}
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;background:rgba(184,151,79,.25);border:1px solid rgba(184,151,79,.25);}
.acard{background:var(--navy-2);padding:34px 30px;position:relative;transition:background .25s;}
.acard:hover{background:#1c3269;}
.acard .date{color:var(--gold-light);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px;}
.acard h3{color:#fff;font-family:'Playfair Display',serif;font-size:21px;margin:0 0 10px;line-height:1.3;}
.acard .loc{color:#94a1c9;font-size:13px;margin-bottom:16px;}
.acard p{color:#c3cae4;font-size:14px;line-height:1.65;margin:0;}
.acard .num{position:absolute;top:26px;right:28px;font-family:'Playfair Display',serif;color:rgba(184,151,79,.4);font-size:34px;}

/* highlights */
.highlights .wrap{max-width:1000px;}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px;}
.hl{border:1px solid var(--line);padding:26px 22px;text-align:center;background:#fff;position:relative;}
.hl::before{content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:1px solid var(--gold-light);pointer-events:none;}
.hl b{display:block;font-family:'Playfair Display',serif;color:var(--gold);font-size:22px;margin-top:10px;}
.hl .item{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--navy);}
.hl .sold{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a39a7f;margin-top:10px;}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px;}
.svc{text-align:center;padding:20px;}
.svc .ic{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);}
.svc h3{font-family:'Playfair Display',serif;color:var(--navy);font-size:20px;margin:0 0 10px;}
.svc p{color:#6b6252;font-size:14px;line-height:1.7;}

/* footer */
footer{background:#0a1530;color:#8b96bd;padding:60px 24px 30px;}
.fwrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;}
footer h4{color:#fff;font-family:'Playfair Display',serif;font-weight:500;font-size:16px;margin:0 0 16px;}
footer a{display:block;color:#8b96bd;font-size:13px;margin-bottom:10px;}
footer a:hover{color:var(--gold-light);}
.fbottom{max-width:1180px;margin:40px auto 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
@media(max-width:700px){.fwrap{grid-template-columns:1fr;}}
</style>

.btn-dark{background:var(--ink);color:#fff;padding:15px 26px;border-radius:100px;font-size:14px;font-weight:600;}

.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

section{padding:100px 28px;}

.acard h3{font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em;}
.acard .meta{font-size:13px;color:var(--grey);margin-bottom:16px;}
.acard p{font-size:14px;line-height:1.65;color:#3d3f44;margin:0;}
.acard .go{display:inline-block;margin-top:20px;font-size:13px;font-weight:600;border-bottom:1px solid var(--ink);}

.hl-row{background:var(--ink);color:#fff;padding:80px 28px;}

.hl-row .shead h2,.hl-row .shead p{color:#fff;}
.hl-row .shead p{color:#a5a6ab;}
.hlc{background:var(--ink);padding:28px 8px;text-align:center;}
.hlc .item{font-family:'Fraunces',serif;font-style:italic;font-size:16px;margin-bottom:10px;}
.hlc b{display:block;font-size:24px;color:#ffb08a;}
.hlc span{font-size:11px;color:#8a8b90;text-transform:uppercase;letter-spacing:.1em;}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;background:var(--line);border:1px solid var(--line);}
.svc{background:#fff;padding:40px 32px;}
.svc .no{font-family:'Fraunces',serif;color:var(--line);font-size:44px;font-weight:600;display:block;margin-bottom:6px;}
.svc h3{font-size:19px;margin:0 0 10px;font-weight:600;}
.svc p{color:var(--grey);font-size:14px;line-height:1.7;margin:0;}

footer{background:#fafaf9;border-top:1px solid var(--line);padding:70px 28px 30px;}
.fwrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:50px;}
footer h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin:0 0 16px;}
footer a{display:block;font-size:14px;margin-bottom:10px;font-weight:500;}
.fbig{font-family:'Fraunces',serif;font-size:26px;margin:0 0 14px;font-weight:500;}
.fbottom{max-width:1240px;margin:50px auto 0;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--grey);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
@media(max-width:800px){.fwrap{grid-template-columns:1fr;}}
</style>

:root{
  --cream:#faf3e7;
  --paper:#fff9f0;
  --terracotta:#bf5b3b;
  --terracotta-d:#a34a2d;
  --sage:#7c8a68;
  --brown:#3d2e22;
  --line:#e8d9bf;
  font-family:'Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--brown);
  background-image:radial-gradient(circle at 1px 1px, rgba(61,46,34,.05) 1px, transparent 0);
  background-size:22px 22px;
}
a{color:inherit;text-decoration:none;}
.serif{font-family:'Libre Baskerville',Georgia,serif;}

header{background:var(--paper);border-bottom:2px solid var(--line);}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:20px 26px;}
.brand{display:flex;align-items:center;}
.brand img{height:34px;width:auto;display:block;}
nav{display:flex;align-items:center;gap:30px;}
nav a{font-size:14px;font-weight:700;color:var(--brown);}
.cta{background:var(--terracotta);color:#fff!important;padding:11px 22px;border-radius:24px;font-size:13px;}
@media(max-width:820px){nav a:not(.cta){display:none;}}

.hero{max-width:1180px;margin:0 auto;padding:80px 26px 70px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;}
.hero .badge{display:inline-block;background:var(--sage);color:#fff;font-size:12px;font-weight:700;padding:7px 16px;border-radius:20px;margin-bottom:22px;}
.hero h1{font-family:'Libre Baskerville',serif;font-size:clamp(34px,4.6vw,54px);line-height:1.18;margin:0 0 20px;color:var(--brown);}
.hero h1 i{color:var(--terracotta);font-style:italic;}
.hero p{font-size:17px;line-height:1.75;color:#5a4a38;margin:0 0 30px;}
.btns{display:flex;gap:14px;flex-wrap:wrap;}
.btn-t{background:var(--terracotta);color:#fff;padding:15px 28px;border-radius:26px;font-weight:700;font-size:14px;box-shadow:0 10px 24px -8px rgba(191,91,59,.55);}
.btn-o{border:2px solid var(--brown);color:var(--brown);padding:13px 26px;border-radius:26px;font-weight:700;font-size:14px;}
.hero-art{aspect-ratio:4/3.4;border-radius:18px;background:
  linear-gradient(160deg,#e9b98a,#bf5b3b 45%,#7c8a68 100%);
  position:relative;overflow:hidden;box-shadow:0 30px 60px -20px rgba(61,46,34,.4);}
.hero-art::before{content:"est. 1982";position:absolute;bottom:22px;left:24px;color:#fff;font-family:'Libre Baskerville',serif;font-style:italic;font-size:20px;opacity:.9;}
.hero-art::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(120deg,rgba(255,255,255,.06) 0 2px,transparent 2px 30px);}
@media(max-width:800px){.hero{grid-template-columns:1fr;}.hero-art{order:-1;}}

section{padding:80px 26px;}
.wrap{max-width:1180px;margin:0 auto;}
.head{text-align:center;max-width:600px;margin:0 auto 50px;}
.head .kicker{color:var(--terracotta);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.head h2{font-family:'Libre Baskerville',serif;font-size:clamp(26px,3.6vw,38px);margin:0 0 12px;}
.head p{color:#5a4a38;font-size:16px;line-height:1.7;}

.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;}
.acard{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:28px 26px;position:relative;transition:transform .2s,box-shadow .2s;}
.acard:hover{transform:translateY(-4px);box-shadow:0 16px 30px -14px rgba(61,46,34,.25);}
.acard .ribbon{position:absolute;top:-12px;left:22px;background:var(--sage);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:12px;letter-spacing:.05em;}
.acard .date{color:var(--terracotta-d);font-weight:800;font-size:13px;margin:14px 0 12px;}
.acard h3{font-family:'Libre Baskerville',serif;font-size:19px;margin:0 0 8px;}
.acard .loc{font-size:13px;color:#8a7a63;margin-bottom:14px;}
.acard p{font-size:14px;line-height:1.65;color:#5a4a38;margin:0;}

.highlights{background:var(--brown);}
.highlights .head h2,.highlights .head p{color:#fff;}
.highlights .head p{color:#d8c8b3;}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}
.hl{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:26px 20px;text-align:center;}
.hl .item{font-family:'Libre Baskerville',serif;font-style:italic;color:#f4e3cc;font-size:16px;}
.hl b{display:block;color:#e9b98a;font-size:23px;margin:10px 0 6px;}
.hl span{font-size:11px;color:#a99a83;text-transform:uppercase;letter-spacing:.08em;}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;}
.svc{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:30px 26px;text-align:center;}
.svc .ic{width:52px;height:52px;border-radius:50%;background:var(--terracotta);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:20px;}
.svc h3{font-family:'Libre Baskerville',serif;font-size:19px;margin:0 0 10px;}
.svc p{font-size:14px;color:#5a4a38;line-height:1.7;}

footer{background:var(--paper);border-top:2px solid var(--line);padding:60px 26px 30px;}
.fwrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px;}
footer h4{font-family:'Libre Baskerville',serif;font-size:16px;margin:0 0 16px;color:var(--terracotta-d);}
footer a{display:block;font-size:14px;margin-bottom:10px;font-weight:600;}
.fbottom{max-width:1180px;margin:40px auto 0;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:#8a7a63;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
@media(max-width:800px){.fwrap{grid-template-columns:1fr;}}
</style>

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg:#0a0a0c;
  --panel:#141417;
  --panel-2:#1b1b1f;
  --line:#2a2a2f;
  --amber:#f2b84b;
  --amber-2:#ffd47a;
  --text:#eceef1;
  --sub:#9497a1;
  font-family:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);}
a{color:inherit;text-decoration:none;}
.mono{font-family:'DM Mono',monospace;}

header{position:sticky;top:0;z-index:50;background:rgba(10,10,12,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.bar{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;}
.brand{display:flex;align-items:center;}
.brand .platt{background:#fff;padding:6px 10px;border-radius:6px;display:flex;align-items:center;}
.brand .platt img{display:block;height:28px;width:auto;}
nav{display:flex;align-items:center;gap:30px;}
nav a{font-size:14px;color:var(--sub);font-weight:500;}
nav a:hover{color:var(--text);}
.cta{background:var(--amber);color:#141414!important;padding:11px 22px;border-radius:8px;font-weight:700;font-size:13px;}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--amber-2);font-family:'DM Mono',monospace;}
.live i{width:7px;height:7px;background:#ff5a5a;border-radius:50%;box-shadow:0 0 10px #ff5a5a;animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:860px){nav a:not(.cta){display:none;}}

.hero{position:relative;max-width:1240px;margin:0 auto;padding:90px 26px 70px;text-align:center;overflow:hidden;}
.hero::before{content:"";position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:900px;height:500px;
  background:radial-gradient(ellipse,rgba(242,184,75,.16),transparent 70%);pointer-events:none;}
.hero .live-row{display:flex;justify-content:center;margin-bottom:28px;position:relative;}
.hero h1{font-size:clamp(38px,6vw,72px);font-weight:700;line-height:1.04;margin:0 0 22px;letter-spacing:-.02em;position:relative;}
.hero h1 span{color:var(--amber);}
.hero p{max-width:560px;margin:0 auto 38px;color:var(--sub);font-size:17px;line-height:1.7;position:relative;}
.btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;}
.btn-amber{background:linear-gradient(180deg,var(--amber-2),var(--amber));color:#171512;padding:16px 30px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:0 12px 30px -10px rgba(242,184,75,.5);}
.btn-ghost{border:1px solid var(--line);color:var(--text);padding:16px 30px;border-radius:10px;font-weight:600;font-size:14px;}

.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);overflow:hidden;white-space:nowrap;padding:14px 0;}
.ticker .track{display:inline-block;animation:scroll 22s linear infinite;font-family:'DM Mono',monospace;font-size:13px;color:var(--sub);}
.ticker b{color:var(--amber-2);}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

section{padding:90px 26px;}
.wrap{max-width:1240px;margin:0 auto;}
.shead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:50px;}
.shead .kicker{font-family:'DM Mono',monospace;font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}
.shead h2{font-size:clamp(28px,3.6vw,40px);font-weight:700;margin:0;letter-spacing:-.01em;}
.shead p{color:var(--sub);font-size:14px;max-width:320px;margin:0;}

.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;position:relative;transition:border-color .2s,transform .2s;}
.acard:hover{border-color:var(--amber);transform:translateY(-3px);}
.acard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.acard .date{font-family:'DM Mono',monospace;font-size:12px;color:var(--amber-2);}
.acard .status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:20px;background:rgba(242,184,75,.12);color:var(--amber);}
.acard h3{font-size:18px;font-weight:600;margin:0 0 8px;}
.acard .loc{font-size:13px;color:var(--sub);margin-bottom:14px;}
.acard p{font-size:13.5px;line-height:1.6;color:#c3c5cc;margin:0 0 18px;}
.acard .bidbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--amber);}

.hl-row{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);}
.hlc{background:var(--bg);padding:30px 24px;}
.hlc .item{font-size:15px;color:var(--sub);margin-bottom:10px;}
.hlc b{display:block;font-family:'DM Mono',monospace;font-size:26px;color:var(--amber-2);}
.hlc span{font-size:11px;color:#6d6f78;text-transform:uppercase;letter-spacing:.08em;}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.svc{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:30px 26px;}
.svc .ic{width:44px;height:44px;border-radius:10px;background:rgba(242,184,75,.12);color:var(--amber);display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-weight:700;}
.svc h3{font-size:18px;margin:0 0 10px;font-weight:600;}
.svc p{color:var(--sub);font-size:14px;line-height:1.7;margin:0;}

footer{background:var(--panel);padding:60px 26px 28px;}
.fwrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;}
footer h4{font-family:'DM Mono',monospace;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px;}
footer a{display:block;font-size:14px;margin-bottom:10px;color:var(--text);font-weight:500;}
.fbottom{max-width:1240px;margin:40px auto 0;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
@media(max-width:800px){.fwrap{grid-template-columns:1fr;}}
</style>
