<!doctype html>
<title>Pence — Homepage Concepts</title>
<meta charset="utf-8">
<style>
  :root{--bg:#15161a;--panel:#1d1e23;--line:#2c2d33;--text:#eceef1;--sub:#9497a1;--accent:#f2b84b;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  header .title{font-weight:700;font-size:14px;margin-right:14px;color:var(--sub);white-space:nowrap;}
  .tab{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .tab:hover{border-color:var(--accent);}
  .tab.active{background:var(--accent);color:#171512;border-color:var(--accent);}
  .tab .n{opacity:.6;margin-right:6px;}
  .tab.active .n{opacity:.7;}
  .openbtn{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--sub);padding:9px 14px;border-radius:8px;font-size:13px;text-decoration:none;white-space:nowrap;}
  .openbtn:hover{color:var(--text);border-color:var(--accent);}
  iframe{flex:1;width:100%;border:0;background:#fff;}
</style>

<header>
  <span class="title">PENCE — HOMEPAGE CONCEPTS</span>
  <button class="tab active" data-src="v1-heritage.html"><span class="n">01</span>Heritage Editorial</button>
  <button class="tab" data-src="v2-modern.html"><span class="n">02</span>Modern Gallery</button>
  <button class="tab" data-src="v3-warm-estate.html"><span class="n">03</span>Warm Estate</button>
  <button class="tab" data-src="v4-bold-tech.html"><span class="n">04</span>Bold Auction-Tech</button>
  <a class="openbtn" id="openNew" href="v1-heritage.html" target="_blank" rel="noopener">Open in new tab ↗</a>
</header>

<iframe id="frame" src="v1-heritage.html" title="Homepage concept preview"></iframe>

<script>
  const tabs = document.querySelectorAll('.tab');
  const frame = document.getElementById('frame');
  const openNew = document.getElementById('openNew');
  tabs.forEach(btn => btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    frame.src = btn.dataset.src;
    openNew.href = btn.dataset.src;
  }));
</script>
